#
# docker-compose.yml — Hermes Agent on Easypanel
#
# Pulls nousresearch/hermes-agent (no local build). One container: s6-overlay
# supervises gateway + dashboard internally. All state lives in the named volume `data`
# mounted at /opt/data (HERMES_HOME) — see README "Persistence".
#
services:
  dashboard:
    # `latest` is rebuilt from upstream main several times a week and is usually AHEAD of
    # the newest GitHub release. Pin HERMES_TAG=v2026.9.7 (a Docker Hub tag) when you
    # want every Redeploy to be reproducible; leave it unset to track main.
    image: nousresearch/hermes-agent:${HERMES_TAG:-latest}
    pull_policy: ${PULL_POLICY:-always}
    restart: unless-stopped
    # Never publish a host port on an Easypanel host: Traefik routes the service's Domain
    # to the container port below, and a `ports:` binding makes a second instance fail
    # with "port is already allocated" while Easypanel still reports success.
    expose:
      - "9119"
    volumes:
      # Named volume, not ./data. Everything Hermes owns lives in /opt/data (HERMES_HOME):
      # config.yaml, SOUL.md, sessions, memories, skills, cron, the agent's own
      # lazy-installed packages (HERMES_LAZY_INSTALL_TARGET=/opt/data/lazy-packages) and
      # anything it pip/npm-installs into /opt/data/home. A bind mount inside the Easypanel
      # checkout survives a normal Deploy but not a re-clone or a service recreate, and it
      # cannot be exported as a volume. Same rule as supabase-easy.
      - data:/opt/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - HERMES_UID=${HERMES_UID:-10000}
      - HERMES_GID=${HERMES_GID:-10000}
      - HERMES_DASHBOARD=1
      # --- Dashboard auth ---
      # Since Hermes v0.21 (2026.9) the dashboard refuses to bind on 0.0.0.0 without an
      # auth provider; HERMES_DASHBOARD_INSECURE no longer disables the gate on a
      # non-loopback bind. Set all three BASIC_AUTH vars. The container fails closed
      # without them — that is the intended behaviour on an internet-facing host.
      - HERMES_DASHBOARD_BASIC_AUTH_USERNAME=${HERMES_DASHBOARD_BASIC_AUTH_USERNAME:-}
      - HERMES_DASHBOARD_BASIC_AUTH_PASSWORD=${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD:-}
      # A random string that makes sessions survive container restarts:
      - HERMES_DASHBOARD_BASIC_AUTH_SECRET=${HERMES_DASHBOARD_BASIC_AUTH_SECRET:-}
      # Kept for images older than 2026.9 only; ignored by current ones. Single-dash
      # default so an explicitly empty value stays empty.
      - HERMES_DASHBOARD_INSECURE=${HERMES_DASHBOARD_INSECURE-}
      # Playwright browsers are BAKED INTO THE IMAGE (/opt/hermes/.playwright, ~266 MB)
      # since 2026. Do not repoint this at the data volume: that directory is empty, so
      # the browser tool would re-download the whole set on first use. Left unset on
      # purpose; override only if you deliberately want them on the volume.
      - PLAYWRIGHT_BROWSERS_PATH=${PLAYWRIGHT_BROWSERS_PATH:-}
      # Default model (format: provider/model-name or just model-name for custom endpoints):
      - HERMES_MODEL=${HERMES_MODEL:-}
      # Custom OpenAI-compatible endpoint (e.g. a vLLM/Ollama box):
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      # Provider API keys — set any of these to switch model/provider in Hermes
      # (use the dashboard /model command). Leave blank to disable a provider.
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}   # multi-model aggregator
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}     # Claude
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}           # Google Gemini
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}       # DeepSeek
      - GROQ_API_KEY=${GROQ_API_KEY:-}               # Groq
      - XAI_API_KEY=${XAI_API_KEY:-}                 # xAI Grok
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}         # Mistral
      # --- Where the agent's own installs land ---
      # Without these, `npm install -g` and `uv tool install` write to /usr/local, i.e. the
      # container layer, and vanish on the next Redeploy. Pointing them at /opt/data/.local
      # puts them on the volume AND on the image's existing PATH (which already contains
      # /opt/data/.local/bin), so the binaries stay callable. Python packages Hermes installs
      # for itself already go to /opt/data/lazy-packages via the image's own
      # HERMES_LAZY_INSTALL_TARGET. Verified working 2026-09-10.
      # System packages (apt) cannot be redirected this way — they need a Dockerfile.
      - NPM_CONFIG_PREFIX=${NPM_CONFIG_PREFIX:-/opt/data/.local}
      - UV_TOOL_DIR=${UV_TOOL_DIR:-/opt/data/.local/uv-tools}
      - UV_TOOL_BIN_DIR=${UV_TOOL_BIN_DIR:-/opt/data/.local/bin}
      # --- Shared Supabase via MCP (see env.md "Supabase MCP") ---
      # When both URL and KEY are set, the boot seed below writes mcp_servers.supabase
      # into config.yaml with a ${SUPABASE_MCP_KEY} placeholder — the key itself never
      # lands on the data volume, Hermes resolves it from this environment at connect time.
      - SUPABASE_MCP_URL=${SUPABASE_MCP_URL:-}
      - SUPABASE_MCP_KEY=${SUPABASE_MCP_KEY:-}
      # Husets egna verktyg (supabase-easy: edge-funktionen `skillhub` bakom samma Kong-nyckel).
      # Tomt värde härleds från SUPABASE_MCP_URL: .../mcp -> .../skillhub. Sätt till "-" för
      # att stänga av. Servern ERSÄTTER inte Supabases MCP, den kompletterar den: execute_sql
      # finns kvar för det som ska uppfinnas, verktygen för det som ska bli konsekvent.
      - SUPABASE_SKILLHUB_URL=${SUPABASE_SKILLHUB_URL:-}
      # This agent's identifier in the shared data (owner / created_by): agent_01 … agent_10,
      # same number as the MCP_KEY slot on the Supabase side. Appended to SOUL.md at boot.
      - HERMES_AGENT_ID=${HERMES_AGENT_ID:-}
      # Uncomment to enable the OpenAI-compatible API server (requires auth key):
      # - API_SERVER_HOST=0.0.0.0
      # - API_SERVER_KEY=${API_SERVER_KEY}
    # Boot seed, then the normal gateway. SOUL.md is the only channel guaranteed to be in
    # the agent's context every turn: measured 2026-09-10, Hermes puts MCP tools in a
    # DEFERRED pool once there are many of them — the agent sees names and a ~60-character
    # truncated description, and the server's own `instructions` never surface at all.
    # Hence the identity line below names the two entry-point tools explicitly.
    # The image's main-wrapper runs this as the
    # `hermes` user with the venv active and HOME=/opt/data, so files it writes get the
    # right owner. Env is applied on EVERY boot (same rule as openclaw-easy): editing the
    # supabase block or the identity line by hand reverts on redeploy — change the env.
    command:
      - sh
      - -c
      - |
        set -e
        if [ -n "${SUPABASE_MCP_URL:-}" ] && [ -n "${SUPABASE_MCP_KEY:-}" ]; then
          hermes config set mcp_servers.supabase.url "$$SUPABASE_MCP_URL" --force >/dev/null
          hermes config set mcp_servers.supabase.headers.apikey '$${SUPABASE_MCP_KEY}' --force >/dev/null
          hermes config set mcp_servers.supabase.enabled true --force >/dev/null
          hermes config set mcp_servers.supabase.timeout 120 --force >/dev/null
          echo "[hermes-easy] mcp_servers.supabase -> $$SUPABASE_MCP_URL"
          # Servern hette `lager` fram till 2026-09-10. Ta bort den gamla posten, annars
          # ligger två servrar mot samma verktyg kvar i konfigurationen efter uppgraderingen.
          hermes config unset mcp_servers.lager >/dev/null 2>&1 || true
          HUB="$${SUPABASE_SKILLHUB_URL:-$${SUPABASE_MCP_URL%/mcp}/skillhub}"
          if [ "$$HUB" != "-" ]; then
            hermes config set mcp_servers.skillhub.url "$$HUB" --force >/dev/null
            hermes config set mcp_servers.skillhub.headers.apikey '$${SUPABASE_MCP_KEY}' --force >/dev/null
            hermes config set mcp_servers.skillhub.enabled true --force >/dev/null
            hermes config set mcp_servers.skillhub.timeout 120 --force >/dev/null
            echo "[hermes-easy] mcp_servers.skillhub -> $$HUB"
          fi
        fi
        if [ -n "${HERMES_AGENT_ID:-}" ]; then
          S="$$HOME/SOUL.md"
          [ -f "$$S" ] || cp /opt/hermes/docker/SOUL.md "$$S"
          grep -v 'hermes-easy:agent-id' "$$S" > "$$S.tmp" && mv "$$S.tmp" "$$S"
          printf '\n\nDelat datalager: din identifierare är %s. Kör verktyget skillhub_oversikt i början av en ny session och skillhub_regler innan du skriver något — reglerna avgör om något ska bli en tabell, en anteckning eller en skill. Sök med skillhub_sok innan du skapar nytt. Skriver du med execute_sql i stället: fyll owner, created_by och updated_by med %s och filtrera alltid på visibility = public eller owner = %s. <!-- hermes-easy:agent-id -->\n' "$$HERMES_AGENT_ID" "$$HERMES_AGENT_ID" "$$HERMES_AGENT_ID" >> "$$S"
          echo "[hermes-easy] SOUL.md identity -> $$HERMES_AGENT_ID"
        fi
        exec hermes gateway run

volumes:
  # Easypanel prefixes this with <project>_<service>, e.g. app_hermes_data.
  data:
